name: Production Preflight (read-only)

# workflow_dispatch ONLY — this can never fire on its own, only an explicit
# dispatch (button click, gh CLI, or API call by someone with write access)
# starts it. Unlike deploy-firebase.yml/showcase-seed.yml, no confirmation
# input is required: this workflow is read-only by construction (see
# scripts/production-preflight/README.md's "Why this is safe" section for
# how that's verified, not just claimed) and there is nothing here for a
# confirmation string to gate.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/production-preflight
        run: npm ci

      - name: Build
        working-directory: scripts/production-preflight
        run: npm run build

      # Same write-to-temp-file pattern deploy-hosting-production.yml uses
      # for this same secret: $RUNNER_TEMP, never printed, never passed as
      # a command argument, removed unconditionally at the end.
      - name: Write Firebase service-account credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

      # No --only flag, no target argument of any kind — this script takes
      # none (see preflight.ts: it accepts zero argv, same convention as
      # showcase-seed's and real-season-import's own CLIs). It only ever
      # calls Firestore .get()/.where(...).get() — see the script's own
      # README for how that's verified structurally, not just asserted.
      - name: Run read-only preflight
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: node dist/production-preflight/preflight.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
