name: TEMP — Invite diagnostic (staging, read-only)

# TEMPORARY. Manual-only, read-only diagnostic for chalkie-app-staging.
# Reads (never writes) the Burnaby Arms B viceCaptain invite doc and the
# matching test account's users/{uid} doc, to diagnose the Captain Invite
# smoke-test redirect bug. scripts/invite-diagnostic/ contains no
# Firestore/Auth write call anywhere — grep-verified by the
# prove-read-only.sh step below, which fails the job before any
# credential is touched if one is found. Never prints a raw token or a
# tokenHash value. This workflow and the script it runs are removed from
# the branch immediately after use.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prove the diagnostic script is read-only (static check, no credentials used)
        working-directory: scripts/invite-diagnostic
        run: bash prove-read-only.sh

      - name: Install dependencies
        working-directory: scripts/invite-diagnostic
        run: npm ci

      - name: Typecheck + build
        working-directory: scripts/invite-diagnostic
        run: npm run build

      - name: Write staging Firebase service-account credential
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STAGING" > "$RUNNER_TEMP/service-account-staging.json"

      - name: Run read-only invite/account diagnostic against chalkie-app-staging
        working-directory: scripts/invite-diagnostic
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account-staging.json
        run: node dist/diagnostic.js

      - name: Remove credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account-staging.json"
