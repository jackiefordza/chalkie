name: TEMP — Admin ownership link (production, 2-field update)

# TEMPORARY. Manual-only, explicit user approval already obtained. Runs
# scripts/admin-ownership-link/link.ts, a small, purpose-built,
# structurally-verified script (no admin.auth() calls, no .set()/.delete()/
# .batch()/.commit() calls — only .update() on a fixed two-field allowlist)
# that links the user's EXISTING production admin account to the EXISTING
# Bedford & Kempston league by updating exactly:
#   - leagues/bedford-kempston-district.adminUserId
#   - users/gkCs46bU9TWe3bMpcgZ198OppCh2.leagueId
# mode=check   -> dry run: reads both documents, verifies preconditions,
#                 writes nothing.
# mode=confirm -> applies the two field updates, then reads both documents
#                 back and reports a full before/after field diff.
# Removed from main again immediately after use.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (read-only, no writes) | confirm (writes the two approved fields)'
        required: true
        default: 'check'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + build
        working-directory: scripts/admin-ownership-link
        run: |
          npm install
          npm run build

      - name: Write Firebase service-account credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

      - name: Run — check (dry run)
        if: ${{ inputs.mode == 'check' }}
        working-directory: scripts/admin-ownership-link
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: set -o pipefail; node dist/link.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run — confirm (writes the two approved fields)
        if: ${{ inputs.mode == 'confirm' }}
        working-directory: scripts/admin-ownership-link
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: set -o pipefail; node dist/link.js --confirm-admin-ownership-link | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
