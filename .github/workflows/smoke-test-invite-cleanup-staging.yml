name: TEMP — Smoke-test invite cleanup (staging)

# TEMPORARY. Manual-only. Deletes the throwaway team/invite/Auth account
# created by scripts/smoke-test-invite-seed for the now-completed manual
# Captain Invite registration smoke test. scripts/smoke-test-invite-cleanup/
# re-verifies (by reading Firestore) that the Auth account belongs ONLY to
# the throwaway team before deleting anything — see that script's
# README.md. Never touches any real league/season/division/team/captain/VC
# account or data. This workflow is removed from main immediately after
# use (the script itself stays on the feature branch for potential reuse).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/smoke-test-invite-cleanup
        run: npm ci

      - name: Typecheck + build
        working-directory: scripts/smoke-test-invite-cleanup
        run: npm run build

      - name: Write staging Firebase service-account credential
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STAGING" > "$RUNNER_TEMP/service-account-staging.json"

      - name: Delete the throwaway smoke-test team/invite/account from chalkie-app-staging
        working-directory: scripts/smoke-test-invite-cleanup
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account-staging.json
        run: node dist/cleanup.js --confirm-smoke-test-cleanup | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account-staging.json"
