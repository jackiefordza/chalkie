name: Deploy Firebase

on:
  push:
    branches: [JakeDevBranch]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'mobile/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Typecheck functions
        working-directory: functions
        run: npx tsc --noEmit

      - name: Run function tests
        working-directory: functions
        run: npm test

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Build web app
        working-directory: mobile
        run: npx expo export -p web

      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project chalkie-app --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json

      - name: Clean up service account key
        if: always()
        run: rm -f /tmp/service-account.json
