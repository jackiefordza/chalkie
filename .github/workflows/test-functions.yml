name: Test Functions

on:
  pull_request:
    paths:
      - 'functions/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Typecheck
        working-directory: functions
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: functions
        run: npm test
